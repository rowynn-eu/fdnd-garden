<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title> </title>
        <link rel="stylesheet" href="./styles/main.css">
        <style>
            body {
                color-scheme: dark;
            }
            main {
                position: relative;

                p {
                    padding-top: 40svh;
                    padding-bottom: 50svh;
                    opacity: 0;
                    animation-name: --paragraph;
                    animation-duration: 10s;
                    animation-timing-function: ease-in-out;
                    animation-fill-mode: backwards;
                    animation-delay: 5s;
                }

                video {
                    display: none;
                    @media (prefers-reduced-motion: no-preference) {
                        z-index: 1;
                        width: 100%;
                        height: 100%;
                        display: block;
                        object-fit: fill;
                        position: fixed;
                        inset: 0;
                        opacity: 0;
                        animation-name: --video;
                        animation-duration: 1s;
                        animation-timing-function: ease-in-out;
                        animation-fill-mode: forwards;
                        animation-delay: 30s;
                    }
                }
                animation-name: --video;
                animation-duration: 1s;
                animation-timing-function: ease-in-out;
                animation-fill-mode: forwards;
                animation-delay: 30s;
            }
            @keyframes --paragraph {
                0%,
                100% {
                    opacity: 0;
                }
                50% {
                    opacity: 1;
                }
            }
            @keyframes --video {
                from {
                    background-color: var(--bg);
                    opacity: 0;
                }
                to {
                    background-color: black;
                    opacity: 1;
                }
            }
        </style>
    </head>
    <body>
        <main>
            <p>
                He who fights with monsters might take care lest he thereby become a monster. And when you gaze long into an abyss the abyss
                also gazes into you. - Friedrich Nietzsche
            </p>
            <video loop autoplay lazy muted>
                <source src="./assets/agony.mp4" type="video/mp4">
                <p>If you can see this, that means your browser does not support video.</p>
            </video>
        </main>
    </body>
</html>
