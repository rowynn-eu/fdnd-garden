<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>&#8203;</title>
        <link rel="stylesheet" href="./styles/default.css">
        <style>
            body {
                color-scheme: dark;
            }
            main {
                position: relative;

                p {
                    padding-top: 40svh;
                    padding-bottom: 50svh;
                    opacity: 0;
                    animation-name: --paragraph;
                    animation-duration: 10s;
                    animation-timing-function: ease-in-out;
                    animation-fill-mode: backwards;
                    animation-delay: 5s;
                }

                video {
                    display: none;
                    @media (prefers-reduced-motion: no-preference) {
                        z-index: 1;
                        width: 100%;
                        height: 100%;
                        display: block;
                        object-fit: fill;
                        position: fixed;
                        inset: 0;
                        opacity: 0;
                        animation-name: --video;
                        animation-duration: 1s;
                        animation-timing-function: ease-in-out;
                        animation-fill-mode: forwards;
                        animation-delay: 30s;
                    }
                }
                animation-name: --video;
                animation-duration: 1s;
                animation-timing-function: ease-in-out;
                animation-fill-mode: forwards;
                animation-delay: 30s;
            }
            @keyframes --paragraph {
                0%,
                100% {
                    opacity: 0;
                }
                50% {
                    opacity: 1;
                }
            }
            @keyframes --video {
                from {
                    background-color: var(--bg);
                    opacity: 0;
                }
                to {
                    background-color: black;
                    opacity: 1;
                }
            }
        </style>
    </head>
    <body>
        <!-- <p>This page is inspired by <a href="https://slashpages.net/#blank" target="_blank">/blank</a></p> -->
        <header>
            <a href="./">
                <picture>
                    <source media="(prefers-color-scheme: dark)" srcset="./assets/logo-dark.svg">
                    <img src="./assets/logo-light.svg" alt="home | rowynn.eu">
                </picture>
            </a>
        </header>

        <main>
            <p>
                He who fights with monsters might take care lest he thereby become a monster. And when you gaze long into an abyss the abyss
                also gazes into you. - Friedrich Nietzsche
            </p>
            <video loop autoplay lazy muted>
                <source
                    src="./assets/agony.mp4"
                    type="video/mp4"
                    alt="This artwork shows the psychological pain of a person, especially a man. We always talk about psychological help for women who suffer a lot from sacrifice, but men in our society are considered strong and all the pressure that is put on them, and they believe that they can either overcome stress or have no stress/Voltage/or any other matter but now it's time for check reality. Men also suffer and have emotions, nervous breakdowns, stress. So, it's time to think about men's mental health as well.

">
                <p>If you can see this, that means your browser does not support video.</p>
                <a href="https://commons.wikimedia.org/wiki/File:Agony_-_Mental_Health.jpg">Dr. Anjali Sehrawat</a>,
                <a href="https://creativecommons.org/licenses/by-sa/4.0">CC BY-SA 4.0</a>, via Wikimedia Commons
            </video>
        </main>
    </body>
</html>
