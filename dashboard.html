<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8">

        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>dashboard - rowynn.eu</title>

        <link rel="stylesheet" href="./styles/default.css">

        <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">

        <style>
            /* meow */

            section > ul {
                display: grid;
                grid-auto-flow: row;
                grid-template-columns: repeat(auto-fit, 125px);

                align-items: center;

                gap: 1em;
                list-style-type: none;
                padding-left: 0;
            }

            section a {
                display: block;
                text-align: center;
                padding: 0.5em;
                color: var(--fg-0);
                background-color: var(--bg-1);

                &:hover {
                    color: var(--bg-0);
                    background-color: var(--fg-1);
                }

                &::after {
                    content: '';
                }
            }

            main {
                section:nth-of-type(1) {
                    ul > li:nth-of-type(1) > a {
                        border-bottom: 0.25em solid var(--purple);
                    }
                    ul > li:nth-of-type(2) > a {
                        border-bottom: 0.25em solid var(--green);
                    }
                    ul > li:nth-of-type(3) > a {
                        border-bottom: 0.25em solid var(--red);
                    }
                    ul > li:nth-of-type(4) > a {
                        border-bottom: 0.25em solid var(--orange);
                    }

                    ul > li:nth-of-type(5) > a {
                        border-bottom: 0.25em solid var(--aqua);
                    }
                }

                section:nth-of-type(2) {
                    ul > li:nth-of-type(2) > a {
                        border-bottom: 0.25em solid var(--aqua);
                    }
                }
            }

            footer {
                margin-top: 50vh;
                display: flex;
                justify-content: center;
                img {
                    width: 40%;
                    height: auto;
                }
            }

            .css {
                border-bottom: 0.25em solid var(--blue);
            }

            .html {
                border-bottom: 0.25em solid var(--orange);
            }

            .js {
                border-bottom: 0.25em solid var(--yellow);
            }

            .note {
                border-bottom: 0.25em solid var(--gray);
            }
        </style>
    </head>
    <body>
        <header>
            <a href="./">
                <picture>
                    <source media="(prefers-color-scheme: dark)" srcset="./assets/logo-dark.svg">
                    <img src="./assets/logo-light.svg" alt="home | rowynn.eu">
                </picture>
            </a>
        </header>

        <main>
            <section>
                <h2>garden</h2>
                <ul>
                    <li><a href="./i-love-web.html">we-&hearts;-web</a></li>

                    <li><a href="./todo.html">to-do</a></li>
                    <li><a href="./experiments.html">experiments</a></li>
                </ul>
            </section>
            <section>
                <h2>bookmarks</h2>
                <ul>
                    <li class="note"><a href="./links.html">links</a></li>
                    <li><a href="https://programma.fdnd.nl/" target="_blank" rel="noopener noreferrer">schedule</a></li>
                    <li class="note">
                        <a href="https://www.a11yproject.com/checklist/#color-contrast" target="_blank" rel="noopener noreferrer"
                            >checklist</a
                        >
                    </li>
                    <li class="css">
                        <a href="https://utopia.fyi/clamp/calculator/" target="_blank" rel="noopener noreferrer">clamp()</a>
                    </li>
                    <li class="css"><a href="https://randoma11y.com" target="_blank" rel="noopener noreferrer">a11y clr</a></li>
                </ul>
            </section>
        </main>

        <footer>
